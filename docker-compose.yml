version: "3.9"

# ============================================================
# Plataforma Multi-Agente Distribuida — Reto 3 SuiteCRM
# ============================================================

x-agent-env: &agent-env
  RABBITMQ_URL: amqp://agentuser:agentpass@rabbitmq:5672/
  REDIS_URL:    redis://redis:6379/0
  PG_DSN:       host=postgres port=5432 dbname=agentdb user=agentuser password=agentpass
  LOG_LEVEL:    INFO

x-agent-depends: &agent-depends
  rabbitmq:
    condition: service_healthy
  redis:
    condition: service_healthy
  postgres:
    condition: service_healthy

networks:
  agentnet:
    driver: bridge

volumes:
  rabbitmq_data:
  redis_data:
  postgres_data:
  suitecrm_data:

services:

  # ── Infraestructura ─────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    hostname: rabbitmq
    networks: [agentnet]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: agentuser
      RABBITMQ_DEFAULT_PASS: agentpass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./init/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./init/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis
    networks: [agentnet]
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    networks: [agentnet]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER:     agentuser
      POSTGRES_PASSWORD: agentpass
      POSTGRES_DB:       agentdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentuser -d agentdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── SuiteCRM Mock (implementa API v4.1 REST igual que SuiteCRM real) ──────────

  suitecrm:
    build:
      context: .
      dockerfile: suitecrm_mock/Dockerfile
    container_name: suitecrm
    networks: [agentnet]
    ports:
      - "8081:8080"
    environment:
      CRM_USER: admin
      CRM_PASS: Admin1234
      DB_PATH:  /data/suitecrm.db
    volumes:
      - suitecrm_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Webhook API ──────────────────────────────────────────────────────────────

  webhook:
    build:
      context: .
      dockerfile: webhook/Dockerfile
    container_name: webhook
    networks: [agentnet]
    ports:
      - "8080:8080"
    environment:
      <<: *agent-env
    depends_on: *agent-depends
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Agente Coordinador ───────────────────────────────────────────────────────

  coordinator:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    container_name: coordinator
    networks: [agentnet]
    environment:
      <<: *agent-env
    depends_on: *agent-depends
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/coordinator.pid || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Agentes Especializados ───────────────────────────────────────────────────

  agent-analysis:
    build:
      context: .
      dockerfile: agents/analysis/Dockerfile
    container_name: agent-analysis
    networks: [agentnet]
    environment:
      <<: *agent-env
      AGENT_NAME: analysis
    depends_on: *agent-depends
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/agent.pid || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  agent-planning:
    build:
      context: .
      dockerfile: agents/planning/Dockerfile
    container_name: agent-planning
    networks: [agentnet]
    environment:
      <<: *agent-env
      AGENT_NAME: planning
    depends_on: *agent-depends
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/agent.pid || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  agent-executor:
    build:
      context: .
      dockerfile: agents/executor/Dockerfile
    container_name: agent-executor
    networks: [agentnet]
    environment:
      <<: *agent-env
      AGENT_NAME:    executor
      SUITECRM_URL:  http://suitecrm:8080
      SUITECRM_USER: admin
      SUITECRM_PASS: Admin1234
      SUITECRM_SIM:  "false"
    depends_on:
      <<: *agent-depends
      suitecrm:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/agent.pid || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  agent-validator:
    build:
      context: .
      dockerfile: agents/validator/Dockerfile
    container_name: agent-validator
    networks: [agentnet]
    environment:
      <<: *agent-env
      AGENT_NAME: validator
    depends_on: *agent-depends
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/agent.pid || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  agent-supervisor:
    build:
      context: .
      dockerfile: agents/supervisor/Dockerfile
    container_name: agent-supervisor
    networks: [agentnet]
    environment:
      <<: *agent-env
      AGENT_NAME:    supervisor
      SUITECRM_URL:  http://suitecrm:8080
      SUITECRM_USER: admin
      SUITECRM_PASS: Admin1234
      SUITECRM_SIM:  "false"
    depends_on:
      <<: *agent-depends
      suitecrm:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/agent.pid || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Dashboard de Monitoreo ───────────────────────────────────────────────────

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: dashboard
    networks: [agentnet]
    ports:
      - "8888:8888"
    environment:
      <<: *agent-env
      SUITECRM_EXTERNAL_URL: http://localhost:8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
